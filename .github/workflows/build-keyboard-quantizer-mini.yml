name: Build keyboard_quantizer/mini (vial)

# ビルド結果は、次のタグのプレリリースにも置く (.github/scripts/firmware-release.sh)。
# 認証なしで取得でき、Artifacts と違って期限切れにならない:
#   firmware-latest         custom ブランチの最新ビルド (push のたびに置き換える)
#   firmware-custom-<sha7>  custom ブランチのビルドの履歴 (新しいものから 30 件を残す)
#   firmware-pr-<番号>      PR のビルド (PR に push するたびに置き換える。新しいものから 30 件を残す)
#   https://github.com/<owner>/<repo>/releases/download/<タグ>/sekigon_keyboard_quantizer_mini_vial.uf2
#   https://github.com/<owner>/<repo>/releases/download/<タグ>/BUILD_INFO.txt
# zmk-config-keyboards の tools/flash.cmd (flash-kq-mini.cmd) は、ここから選んだビルドを書き込む。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build sekigon/keyboard_quantizer/mini:vial:uf2
    runs-on: ubuntu-latest
    # 同じ ref の古いビルドは取り消す。公開のジョブには掛けない (リリースを消した後、作る前に
    # 取り消されると、そのタグのリリースが無くなるため)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$(pwd)"

      - name: Debug environment
        run: |
          echo "## Environment" | tee -a "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD
          git describe --tags --long --dirty="\*" 2>&1 || echo "(git describe failed)"
          git submodule status | head -20
          which qmk && qmk --version || true
          arm-none-eabi-gcc --version | head -1 || true

      - name: Build firmware
        id: build
        shell: bash
        run: |
          set -o pipefail
          make sekigon/keyboard_quantizer/mini:vial:uf2 VERBOSE=true BREAK_ON_ERRORS=yes 2>&1 | tee build.log
          echo "::group::Tail of build.log"
          tail -80 build.log
          echo "::endgroup::"
          # Explicit success verification — make may exit 0 even when no .uf2 is produced
          if ! ls .build/*.uf2 >/dev/null 2>&1; then
            echo "::error::No .uf2 was produced under .build/ despite make exiting 0"
            ls -la .build/ 2>&1 || true
            exit 1
          fi

      - name: Locate .uf2 outputs
        if: ${{ always() }}
        shell: bash
        run: |
          echo "## Post-build directory listings" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::group::repo root listing"
          ls -la
          echo "::endgroup::"
          echo "::group::find any .uf2/.bin/.hex/.elf"
          find . -maxdepth 6 \( -name '*.uf2' -o -name '*.bin' -o -name '*.hex' -o -name '*.elf' \) -print 2>/dev/null
          echo "::endgroup::"
          echo "::group::.build/ listing"
          ls -la .build/ 2>&1 || echo "(no .build/)"
          echo "::endgroup::"
          if [ -d .build ]; then
            for log in .build/failed.log.* .failed; do
              [ -f "$log" ] || continue
              printf '\n::group::%s\n' "$log"
              cat "$log"
              printf '::endgroup::\n'
            done
          fi

      - name: Upload .uf2 artifact
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: sekigon_keyboard_quantizer_mini_vial
          path: .build/*.uf2
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            .build/**
            .failed
          if-no-files-found: ignore
          include-hidden-files: true

  publish-latest:
    name: Publish firmware-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/custom'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: firmware-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sekigon_keyboard_quantizer_mini_vial
          path: firmware
      - name: Publish firmware-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          DESCRIPTION: sekigon/keyboard_quantizer/mini:vial
        run: bash .github/scripts/firmware-release.sh latest firmware/sekigon_keyboard_quantizer_mini_vial.uf2

  # 待機中のジョブは、同じグループの新しいジョブに取り消されるので、コミットごとにグループを分ける
  # (続けて push しても、それぞれのビルドが履歴に残る)
  publish-custom:
    name: Publish firmware-custom
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/custom'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: firmware-custom-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sekigon_keyboard_quantizer_mini_vial
          path: firmware
      - name: Publish firmware-custom-<sha7>
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          DESCRIPTION: sekigon/keyboard_quantizer/mini:vial
          KEEP: '30'
        run: bash .github/scripts/firmware-release.sh custom firmware/sekigon_keyboard_quantizer_mini_vial.uf2

  # 同じリポジトリのブランチからの PR だけ (fork と Dependabot の PR は書き込み権限が無い)
  publish-pr:
    name: Publish firmware-pr
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: firmware-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sekigon_keyboard_quantizer_mini_vial
          path: firmware
      - name: Publish firmware-pr-<number>
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          DESCRIPTION: sekigon/keyboard_quantizer/mini:vial
          KEEP: '30'
        run: bash .github/scripts/firmware-release.sh pr firmware/sekigon_keyboard_quantizer_mini_vial.uf2
