name: Build keyboard_quantizer/mini (vial)

# custom ブランチのビルド結果は、固定タグ firmware-latest のプレリリースにも置く
# (publish ジョブ)。次の URL から認証なしで取得でき、Artifacts と違って期限切れにならない:
#   https://github.com/<owner>/<repo>/releases/download/firmware-latest/sekigon_keyboard_quantizer_mini_vial.uf2
#   https://github.com/<owner>/<repo>/releases/download/firmware-latest/BUILD_INFO.txt
# zmk-config-keyboards の tools/flash-kq-mini.cmd はここから最新版を取得して書き込む。

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build sekigon/keyboard_quantizer/mini:vial:uf2
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$(pwd)"

      - name: Debug environment
        run: |
          echo "## Environment" | tee -a "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD
          git describe --tags --long --dirty="\*" 2>&1 || echo "(git describe failed)"
          git submodule status | head -20
          which qmk && qmk --version || true
          arm-none-eabi-gcc --version | head -1 || true

      - name: Build firmware
        id: build
        shell: bash
        run: |
          set -o pipefail
          make sekigon/keyboard_quantizer/mini:vial:uf2 VERBOSE=true BREAK_ON_ERRORS=yes 2>&1 | tee build.log
          echo "::group::Tail of build.log"
          tail -80 build.log
          echo "::endgroup::"
          # Explicit success verification — make may exit 0 even when no .uf2 is produced
          if ! ls .build/*.uf2 >/dev/null 2>&1; then
            echo "::error::No .uf2 was produced under .build/ despite make exiting 0"
            ls -la .build/ 2>&1 || true
            exit 1
          fi

      - name: Locate .uf2 outputs
        if: ${{ always() }}
        shell: bash
        run: |
          echo "## Post-build directory listings" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::group::repo root listing"
          ls -la
          echo "::endgroup::"
          echo "::group::find any .uf2/.bin/.hex/.elf"
          find . -maxdepth 6 \( -name '*.uf2' -o -name '*.bin' -o -name '*.hex' -o -name '*.elf' \) -print 2>/dev/null
          echo "::endgroup::"
          echo "::group::.build/ listing"
          ls -la .build/ 2>&1 || echo "(no .build/)"
          echo "::endgroup::"
          if [ -d .build ]; then
            for log in .build/failed.log.* .failed; do
              [ -f "$log" ] || continue
              printf '\n::group::%s\n' "$log"
              cat "$log"
              printf '::endgroup::\n'
            done
          fi

      - name: Upload .uf2 artifact
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: sekigon_keyboard_quantizer_mini_vial
          path: .build/*.uf2
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            .build/**
            .failed
          if-no-files-found: ignore
          include-hidden-files: true

  publish:
    name: Publish firmware-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/custom'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: firmware-latest
      cancel-in-progress: false

    steps:
      - name: Download .uf2 artifact
        uses: actions/download-artifact@v4
        with:
          name: sekigon_keyboard_quantizer_mini_vial

      - name: Write BUILD_INFO.txt
        run: |
          {
            echo "repository: ${GITHUB_REPOSITORY}"
            echo "branch: ${GITHUB_REF_NAME}"
            echo "commit: ${GITHUB_SHA}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > BUILD_INFO.txt
          cat BUILD_INFO.txt
          ls -l sekigon_keyboard_quantizer_mini_vial.uf2

      # リリースは作り直すが、タグ firmware-latest は削除せず、このビルドのコミットへ付け替える。
      # GitHub はタグの削除を後から非同期に処理し、そのとき同じタグ名のリリースを下書きに戻す。
      # 以前のようにタグも消して (--cleanup-tag) すぐ作り直すと、作ったばかりの新しいリリースまで
      # 下書きにされ、ダウンロード URL が 404 になることがあった (zmk-config-LisM の build.yml と同じ)。
      # プレリリースなので releases/latest には影響しない。
      - name: Replace firmware-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: firmware-latest
        run: |
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --silent 2>/dev/null; then
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${TAG}" -f sha="${GITHUB_SHA}" -F force=true --silent \
              || echo "::warning::タグ ${TAG} を ${GITHUB_SHA::7} に付け替えられなかったため、前のコミットのままリリースを作ります (中身のコミットは BUILD_INFO.txt を参照)"
          else
            gh api -X POST "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" --silent
          fi

          # 下書きに戻されたものも含めて、このタグのリリースをすべて消す (タグは消さない)
          for id in $(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
                        --jq ".[] | select(.tag_name == \"${TAG}\") | .id"); do
            gh api -X DELETE "repos/${GH_REPO}/releases/${id}" --silent
          done

          gh release create "${TAG}" \
            --verify-tag \
            --prerelease \
            --title "Latest firmware (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
            --notes "custom ブランチの最新ビルド (sekigon/keyboard_quantizer/mini:vial)。push のたびに自動で置き換わります。詳細は BUILD_INFO.txt を参照。" \
            sekigon_keyboard_quantizer_mini_vial.uf2 BUILD_INFO.txt

      # 認証なしで今回のビルドを取得できるかを確かめる。下書きになっていたら公開し直し、
      # それでも取得できなければジョブを失敗させる (書き込みスクリプトが 404 になる状態を見逃さない)。
      - name: Verify firmware-latest is downloadable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: firmware-latest
        run: |
          url="${GITHUB_SERVER_URL}/${GH_REPO}/releases/download/${TAG}/BUILD_INFO.txt"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "${url}" | grep -qx "commit: ${GITHUB_SHA}"; then
              echo "OK: ${url}"
              exit 0
            fi
            for id in $(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
                          --jq ".[] | select(.tag_name == \"${TAG}\" and .draft) | .id"); do
              echo "::warning::${TAG} リリース (${id}) が下書きになっているため公開し直します"
              gh api -X PATCH "repos/${GH_REPO}/releases/${id}" -F draft=false --silent
            done
            sleep 10
          done
          echo "::error::${url} から今回のビルド (${GITHUB_SHA::7}) を取得できません"
          exit 1
